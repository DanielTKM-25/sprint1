<body>
  <h1>
    Me contacter
  </h1>
  <p>Vous avez un projet, une question ou une opportunité a partager? n'hésitez pas a m'ecrire!</p>

    </form>
    <form>
       <label>Adresse e-mail📩</label><br>
      <input type="mailto">
    </form>
    <form>
      <label>sujet💡</label><br>
      <select id="sujet" name="sujet">
        <option value="--choisissez un sujet--">--choisissez un sujet--</option>

      </select>
    </form>
    <form>
      <label>Message📛</label><br>
      <textarea id="message" name="message" required="">Écrivez votre message ici</textarea><br>
      <input type="checkbox" id="condition" name="condition">
      <label for="condition">J'accepte que mes données soient utilisées pour répondre à ma demande</label><br>
  
    </form>
